<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Echoes of Eternity — Chapter I</title>
<style>
:root{--ink:#172033;--paper:#eee4b8;--blue:#5578b8;--red:#b94d52;--gold:#dfb95e}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101522;color:var(--ink);font-family:"Courier New",monospace}#game{width:min(960px,96vw);height:min(640px,92vh);min-height:520px;display:grid;grid-template-columns:1fr 250px;border:7px solid #554e3d;background:var(--paper);box-shadow:0 18px 60px #0009}#world{position:relative;overflow:hidden;border-right:5px solid #554e3d}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}aside{padding:12px;background:#ddd2a8;overflow:auto}h1{margin:-12px -12px 10px;padding:12px 6px;background:#383d43;color:#f7edbd;text-align:center;font-size:19px}h2{font-size:14px;margin:10px 0 5px;border-bottom:2px solid #77735f}.box{background:#f3eccb;border:3px solid #77735f;padding:8px;margin-bottom:8px}.bar{height:9px;border:2px solid #3d3d3d;background:#3d3d3d;margin:4px 0}.bar i{display:block;height:100%;background:var(--red)}.mp i{background:var(--blue)}.xp i{background:#72a35c}#dialogue,#battle,#menu{position:absolute;display:none;border:4px solid #30323a;background:#edf0d2;box-shadow:6px 6px 0 #30323a55}#dialogue{left:20px;right:20px;bottom:18px;min-height:112px;padding:13px 15px;line-height:1.4}#dialogue b{display:block;margin-bottom:5px}#battle{inset:18px}#menu{inset:0;background:#181c29c9;place-items:center}#menu .panel{width:300px;padding:16px;border:5px solid #30323a;background:#eae2b9}button{font:14px "Courier New",monospace;background:#f4eccd;border:3px solid #77735f;margin:5px;padding:8px;cursor:pointer}#battleTop{height:60%;position:relative;background:linear-gradient(#8fb9c9 0 66%,#6d9262 66%)}#enemyName{position:absolute;right:80px;bottom:55px;color:#fff;text-shadow:2px 2px #30323a}#enemySprite{position:absolute;right:85px;bottom:75px;width:92px;height:92px;background:#6c607e;border:8px solid #40384d;box-shadow:inset -12px -12px #554967;image-rendering:pixelated}#enemySprite:before{content:"";position:absolute;left:-18px;top:-18px;width:24px;height:24px;background:#40384d;box-shadow:104px 0 #40384d}#enemySprite:after{content:"";position:absolute;left:25px;top:26px;width:10px;height:10px;background:#eee4b8;box-shadow:38px 0 #eee4b8,38px 38px #40384d,-18px 38px #40384d}#battleBottom{height:40%;display:grid;grid-template-columns:1fr 230px;background:#eae2b9;border-top:5px solid #30323a}#battleText{padding:12px;border-right:4px solid #30323a;font-size:17px;line-height:1.4}#battleCommands{padding:8px}#battleCommands button{display:block;width:100%;text-align:left}#toast{position:absolute;top:14px;left:50%;transform:translateX(-50%);padding:7px 11px;background:#30323a;color:#fff5cf;border:3px solid #fff5cf;opacity:0;transition:.2s}#toast.show{opacity:1}@media(max-width:760px){#game{grid-template-columns:1fr 190px}aside{font-size:11px}#battleBottom{grid-template-columns:1fr 180px}}
</style>
</head>
<body>
<main id="game">
<section id="world"><canvas id="canvas" width="704" height="640"></canvas><div id="toast"></div><div id="dialogue"></div><div id="battle"><div id="battleTop"><div id="enemySprite"></div><div id="enemyName"></div></div><div id="battleBottom"><div id="battleText">A wild Hollow appears!</div><div id="battleCommands"><button data-command="attack">Fight</button><button data-command="magic">Magic · 6 MP</button><button data-command="item">Potion × <span id="potions">3</span></button><button data-command="run">Run</button></div></div></div><div id="menu"><div class="panel"><h2>MENU</h2><button id="party">Party</button><button id="items">Items</button><button id="journal">Journal</button><button id="save">Save Game</button><button id="close">Close</button></div></div></section>
<aside><h1>ECHOES OF ETERNITY</h1><h2>ADVENTURER</h2><div class="box"><b>Ari</b><br>Wayfarer · Level <span id="level">1</span><br>HP <span id="hp">32</span>/32<div class="bar"><i id="hpbar" style="width:100%"></i></div>MP <span id="mp">12</span>/12<div class="bar mp"><i id="mpbar" style="width:100%"></i></div>XP <span id="xp">0</span>/20<div class="bar xp"><i id="xpbar" style="width:0"></i></div>Gold <span id="gold">25</span></div><h2>COMPANIONS</h2><div class="box" id="companions">No companions yet.</div><h2>QUEST JOURNAL</h2><div class="box" id="quest">Find Elder Rowan in Willowbrook Village.</div></aside>
</main>
<script>
(()=>{const C=document.getElementById('canvas'),x=C.getContext('2d'),D=document.getElementById('dialogue'),B=document.getElementById('battle'),M=document.getElementById('menu'),T=document.getElementById('toast');const def={px:170,py:470,hp:32,mp:12,xp:0,gold:25,level:1,potions:3,quest:'elder',talked:false,battles:0,sigil:false};let s=Object.assign({},def,JSON.parse(localStorage.getItem('eoe-ch1-gba')||'{}')),keys={},battle=null,step=0,dialogueDone=null;
const elder={x:510,y:210},well={x:375,y:330};function r(a,b,c,d,e){x.fillStyle=e;x.fillRect(a,b,c,d)}
function ui(){for(const [id,val] of [['hp',s.hp],['mp',s.mp],['xp',s.xp],['gold',s.gold],['level',s.level],['potions',s.potions]])document.getElementById(id).textContent=val;document.getElementById('hpbar').style.width=s.hp/32*100+'%';document.getElementById('mpbar').style.width=s.mp/12*100+'%';document.getElementById('xpbar').style.width=s.xp/20*100+'%'}
function save(){localStorage.setItem('eoe-ch1-gba',JSON.stringify(s));toast('Game saved')}function toast(v){T.textContent=v;T.className='show';clearTimeout(toast.t);toast.t=setTimeout(()=>T.className='',1800)}
function world(){r(0,0,704,640,'#83a96d');r(0,400,704,100,'#c3ad75');r(300,0,110,640,'#c3ad75');[[35,85],[210,60],[520,70],[530,370],[50,350]].forEach((v,i)=>{r(v[0],v[1],150,115,'#734a38');r(v[0]+12,v[1]+16,126,99,i%2?'#c49b58':'#b98d52');r(v[0]+25,v[1]-24,100,25,'#594137');r(v[0]+58,v[1]+58,34,57,'#45382f')});for(let i=0;i<25;i++){let a=(i*113+20)%680,b=(i*97+40)%590;r(a+14,b+20,12,30,'#594735');r(a,b,42,32,'#3d7048')}r(350,300,90,52,'#77776a');r(360,290,70,16,'#aaa58b');r(364,258,8,35,'#77776a');r(420,258,8,35,'#77776a');r(358,253,70,8,'#aaa58b');r(elder.x-12,elder.y-18,24,38,'#d5cfb9');r(elder.x-8,elder.y-30,16,14,'#c49a78');r(elder.x-11,elder.y-34,22,8,'#dfe6dd');r(s.px-12,s.py-18,24,38,'#667fad');r(s.px-8,s.py-30,16,14,'#d3a77f');r(s.px-11,s.py-34,22,7,'#704d37');r(s.px-10,s.py+20,8,10,'#4d3b32');r(s.px+2,s.py+20,8,10,'#4d3b32')}
function dialogue(title,text,done){D.innerHTML='<b>'+title+'</b>'+text+'<br><small>Press Enter / Space</small>';D.style.display='block';dialogueDone=done}
function closeDialogue(){D.style.display='none';if(dialogueDone){let f=dialogueDone;dialogueDone=null;f()}}
function interact(){if(D.style.display==='block'){closeDialogue();return}if(distance(s,elder)<76){if(!s.talked)dialogue('Elder Rowan','A shadow stirs near the western grove. Meet me at the ancient well, Ari.',()=>{s.talked=true;s.quest='sigil';document.getElementById('quest').textContent='Search the ancient well for the lost sigil.';ui();save()});else if(s.quest==='sigil')dialogue('Elder Rowan','The hollow creatures gather around the well. Defeat them and recover the sigil.');else if(s.quest==='complete')dialogue('Elder Rowan','The village is safe—for now. The echoes are awakening.')}
else if(distance(s,well)<85&&s.talked&&s.quest==='sigil'){dialogue('Ancient Well','A lost forest sigil glows beneath the stones. It is yours—Chapter I is complete!',()=>{s.sigil=true;s.quest='complete';s.xp=Math.min(20,s.xp+20);s.gold+=15;document.getElementById('quest').textContent='Chapter I complete — return to Elder Rowan.';ui();save()})}else toast('Nothing here responds.')}
function distance(a,b){return Math.hypot(a.px-b.x,a.py-b.y)}
function startBattle(){battle={enemy:'Hollow Wolf',ehp:24,turn:true};B.style.display='block';document.getElementById('enemyName').textContent=battle.enemy+' — HP '+battle.ehp;document.getElementById('battleText').textContent='A wild Hollow Wolf appears!'}
function command(type){if(!battle)return;if(!battle.turn)return;if(type==='run'){if(Math.random()<.5){endBattle('Ari escaped!')}else enemyTurn('The Hollow blocks the path!')}else if(type==='attack'){battle.ehp-=8;document.getElementById('battleText').textContent='Ari strikes for 8 damage!';afterPlayer()}else if(type==='magic'){if(s.mp>=6){s.mp-=6;battle.ehp-=14;document.getElementById('battleText').textContent='Ari casts Lumen for 14 damage!';afterPlayer()}else enemyTurn('Not enough MP!')}else if(type==='item'){if(s.potions>0){s.potions--;s.hp=Math.min(32,s.hp+16);document.getElementById('battleText').textContent='Ari drinks a Potion and restores 16 HP!';ui();afterPlayer()}else enemyTurn('No Potions remain!')}}
function afterPlayer(){document.getElementById('enemyName').textContent=battle.enemy+' — HP '+Math.max(0,battle.ehp);ui();battle.turn=false;if(battle.ehp<=0)setTimeout(()=>{let gold=10+s.level*2;s.gold+=gold;s.xp+=10;s.battles++;if(s.xp>=20&&s.level===1){s.level++;s.xp-=20;s.hp=32;s.mp=12;toast('Level 2! Ari grows stronger.')}endBattle('Victory! Gained '+gold+' gold and 10 XP.')},550);else setTimeout(()=>enemyTurn(),650)}
function enemyTurn(extra){battle.turn=false;let dmg=Math.floor(5+Math.random()*5);s.hp=Math.max(0,s.hp-dmg);ui();document.getElementById('battleText').textContent=(extra?extra+' ':'')+'The Hollow Wolf attacks for '+dmg+' damage!';if(s.hp<=0)setTimeout(()=>{s.hp=32;s.px=170;s.py=470;endBattle('Ari wakes in Willowbrook.');},700);else setTimeout(()=>{battle.turn=true;document.getElementById('battleText').textContent='Choose a command.'},700)}
function endBattle(text){document.getElementById('battleText').textContent=text;setTimeout(()=>{B.style.display='none';battle=null;ui()},900)}
function update(){if(D.style.display==='block'||M.style.display==='grid'||B.style.display==='block')return;let dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);if(dx&&dy){dx*=.707;dy*=.707}s.px=Math.max(16,Math.min(688,s.px+dx*3));s.py=Math.max(28,Math.min(612,s.py+dy*3));step+=Math.abs(dx)+Math.abs(dy);if(step>380&&Math.random()<.018&&s.talked){step=0;startBattle()}}
addEventListener('keydown',e=>{keys[e.key]=true;keys[e.key.toLowerCase()]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key==='Escape')M.style.display=M.style.display==='grid'?'none':'grid';if((e.key===' '||e.key==='Enter')&&!e.repeat){if(B.style.display==='block'){}else interact()}if(e.shiftKey&&e.key.toLowerCase()==='s')save()});addEventListener('keyup',e=>{keys[e.key]=false;keys[e.key.toLowerCase()]=false});
document.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>command(b.dataset.command));[['close','close'],['party','party'],['items','items'],['journal','journal'],['save','save']].forEach(a=>{let id=a[0],mode=a[1];document.getElementById(id).onclick=()=>{if(mode==='close')M.style.display='none';else if(mode==='save')save();else toast(mode==='party'?'Party: Ari — Wayfarer':mode==='items'?('Items: Potion × '+s.potions):'Journal: The First Awakening')}});function loop(){update();world();requestAnimationFrame(loop)}ui();loop();})();
</script>
</body>
</html>
